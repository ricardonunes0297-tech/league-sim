<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League Sim</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4D36">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --turf:#1F4D36; --turf2:#245840; --chalk:#F4F6F2; --chalk-dim:#B9CBBE;
  --paper:#F3F5F2; --surface:#FFFFFF; --ink:#16201A; --muted:#5B685F; --line:#D6DDD7;
  --flood:#E8C547; --star:#B8890A; --gold:#B8860B; --sel:#1F4D36; --win:#2E8B57; --draw:#8A948E; --loss:#C2412F;
  --hd:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --bd:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --turf:#123526; --turf2:#163D2C; --chalk:#ECF1ED; --chalk-dim:#9FB5A6;
    --paper:#0E1411; --surface:#161E1A; --ink:#E6ECE7; --muted:#9AA79F; --line:#29342E;
    --star:#E8C547; --gold:#E2B33C; --sel:#E8C547; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --turf:#123526; --turf2:#163D2C; --chalk:#ECF1ED; --chalk-dim:#9FB5A6;
    --paper:#0E1411; --surface:#161E1A; --ink:#E6ECE7; --muted:#9AA79F; --line:#29342E;
    --star:#E8C547; --gold:#E2B33C; --sel:#E8C547; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--bd)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flood);outline-offset:2px}
h1,h2,h3{font-family:var(--hd);font-weight:700;line-height:1.1;margin:0 0 .6em}
h1{font-size:2.6rem}
h2{font-size:1.8rem}
h3{font-size:1.25rem;margin-top:1.4em}
.num{font-family:var(--hd);font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{--chalkline:color-mix(in srgb,var(--chalk) 38%,transparent);background:var(--turf);color:var(--chalk);padding:20px 18px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
.side::after{content:"";position:absolute;inset:8px;border:2px solid var(--chalkline);pointer-events:none}
.side .hd{position:relative;margin:-12px 8px 6px;padding:16px 12px 18px;border:2px solid var(--chalkline);border-top:0}
.side .hd::after{content:"";position:absolute;top:100%;left:50%;width:56px;height:16px;margin-left:-28px;margin-top:2px;border:2px solid var(--chalkline);border-top:0;border-radius:0 0 28px 28px;box-sizing:border-box}
.side .lg{font-family:var(--hd);font-size:1.7rem;font-weight:700;line-height:1.05}
.side .meta{color:var(--chalk-dim);font-size:.9rem;margin-top:4px}
.nav{display:flex;flex-direction:column;margin:0 -18px}
.nav button{background:none;border:0;text-align:left;padding:9px 30px;border-radius:0;color:var(--chalk);font-family:var(--hd);font-size:1.15rem;font-weight:600;cursor:pointer}
.nav button:nth-child(even){background:var(--turf2)}
.nav button:hover{box-shadow:inset 0 0 0 999px rgba(255,255,255,.07)}
.nav button.on{box-shadow:inset 6px 0 0 var(--flood),inset 0 0 0 999px rgba(255,255,255,.13)}
.simbox{position:relative;display:flex;flex-direction:column;gap:8px;margin:0 -10px;padding:30px 10px 0;border-top:2px solid var(--chalkline)}
.simbox::before{content:"";position:absolute;top:-24px;left:50%;width:46px;height:46px;margin-left:-23px;border:2px solid var(--chalkline);border-radius:50%;box-sizing:border-box;pointer-events:none}
.simbox::after{content:"";position:absolute;top:-4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--chalkline)}
.filebox{position:relative;margin:auto 4px -12px;padding:16px 8px 18px;border:2px solid var(--chalkline);border-bottom:0;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.filebox::before{content:"";position:absolute;bottom:100%;left:50%;width:56px;height:16px;margin-left:-28px;margin-bottom:2px;border:2px solid var(--chalkline);border-bottom:0;border-radius:28px 28px 0 0;box-sizing:border-box}
.filebox .row{display:flex;gap:5px}
.filebox .row .btn{flex:1;padding-left:4px;padding-right:4px;white-space:nowrap}
.savestate{color:var(--chalk-dim)}
.savestate.dirty{color:var(--flood)}
main{padding:28px clamp(16px,4vw,44px) 60px;max-width:1200px;width:100%}

/* buttons */
.btn{border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--flood);color:var(--on-flood,#1B1A10);border-color:var(--flood);font-family:var(--hd);font-size:1.15rem;letter-spacing:.01em}
.btn.go:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--chalk);border-color:rgba(255,255,255,.35);flex:1;padding:7px 8px}
.btn.ghost:hover{border-color:var(--chalk)}
.btn.danger{color:var(--loss);border-color:var(--loss);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}

/* tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;white-space:nowrap}
th{font-family:var(--hd);font-weight:600;color:var(--muted);font-size:1rem;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
th.sortable{cursor:pointer}
th.sortable.on{color:var(--ink)}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--flood) 9%,transparent)}
.pos1 td:first-child{box-shadow:inset 3px 0 var(--flood)}
.pts{font-weight:700;font-size:1.1rem}
.club{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.badge{flex:none;display:block}
.form{display:flex;gap:3px}
.form span{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}

.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fx .h{justify-self:end;text-align:right}
.fx .score{white-space:nowrap;font-family:var(--hd);font-size:1.4rem;font-weight:700;min-width:64px;text-align:center;background:var(--paper);border-radius:6px;padding:0 8px}
.fx .vs{color:var(--muted);font-family:var(--hd)}
details.res>summary{list-style:none;cursor:pointer}
details.res>summary::-webkit-details-marker{display:none}
.ev{font-size:.88rem;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:4px 0 10px}
.ev .away{text-align:right}
.round{margin-bottom:10px}
.round>summary{font-family:var(--hd);font-size:1.25rem;font-weight:600;cursor:pointer;padding:6px 0}

.stars{display:inline-flex;gap:1px;color:var(--star);letter-spacing:0}
.stars button{background:none;border:0;padding:0 1px;cursor:pointer;color:inherit;font-size:1.05rem;line-height:1}
.stars .off{color:var(--line)}
.rt{color:var(--muted);font-size:.8rem;margin-left:4px}

.banner{background:var(--turf);color:var(--chalk);border-radius:12px;padding:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.banner h2{font-size:2.4rem;margin:0}
.banner p{margin:.2em 0;color:var(--chalk-dim)}
.banner .grow{flex:1;min-width:220px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.clubcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;display:flex;gap:14px;align-items:center;text-align:left}
.clubcard:hover{border-color:var(--muted)}
.clubcard .nm{font-family:var(--hd);font-size:1.3rem;font-weight:700;line-height:1.1}
.clubcard .sub{color:var(--muted);font-size:.85rem}

.clubhead{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.fields{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink)}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
td input[type=text]{width:100%;min-width:140px;padding:4px 6px}
td input[type=number]{width:60px;padding:4px 6px}
td select{padding:4px 6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

/* setup */
.setup{max-width:820px;margin:0 auto;padding:40px 20px 80px}
.setup .lede{color:var(--muted);max-width:60ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 16px;cursor:pointer;font-family:var(--hd);font-size:1.1rem;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--turf);color:var(--chalk)}
.srow{display:grid;grid-template-columns:auto 1fr 1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.step{margin:28px 0}
.step h2{font-size:1.4rem}

.trophy{display:inline-flex;align-items:center;gap:2px;color:var(--gold);font-family:var(--hd);font-weight:700;font-size:.95rem;vertical-align:middle}
.trophy.big{font-size:1.6rem;gap:6px}
img.px,.px{image-rendering:crisp-edges;image-rendering:pixelated}
.rings{display:inline-flex;align-items:center;vertical-align:middle;padding:2px 4px 2px 2px;border-radius:8px;cursor:default;position:relative}
.ring{position:relative;flex:none;display:inline-flex;flex-direction:column;align-items:center;line-height:0;margin-left:var(--ov,-28px);transition:margin-left .22s ease;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.ring:first-child{margin-left:0}
.ring em{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:700 .68rem/1 var(--hd);font-style:normal;color:var(--ink);opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.rings:hover,.rings:focus{z-index:2}
.rings:hover .ring,.rings:focus .ring{margin-left:4px}
.rings:hover .ring:first-child,.rings:focus .ring:first-child{margin-left:0}
.rings:hover .ring em,.rings:focus .ring em{opacity:1;position:static;transform:none;height:0;margin-top:3px}
.rings.awards:hover .ring:not(:first-child),.rings.awards:focus .ring:not(:first-child){margin-left:8px}
.rings .ringn{margin-left:6px;font:700 .95rem var(--hd);color:var(--gold)}
.trophy .tx{font-family:var(--hd);font-weight:700}
.flag{display:inline-block;vertical-align:middle;border-radius:2px;flex:none}
.namecell{display:inline-flex;align-items:center;gap:7px}
.injtag{display:inline-grid;place-items:center;min-width:22px;height:16px;padding:0 4px;margin-left:6px;border-radius:4px;background:var(--loss);color:#fff;font:700 .72rem/1 var(--bd);vertical-align:middle}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--ink);min-width:200px}
.mdnav{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.mdlist{display:flex;gap:4px;overflow-x:auto;padding:4px 2px;flex:1}
.md{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 1rem var(--hd);cursor:pointer;flex:none;color:var(--ink)}
.md.done{background:color-mix(in srgb,var(--turf) 14%,var(--surface))}
.md.next{box-shadow:inset 0 0 0 2px var(--flood)}
.md.on{background:var(--turf);color:var(--chalk);border-color:var(--turf)}
.md.cupday{position:relative}
.md.cupday::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.bround h4{font-family:var(--hd);font-size:1.2rem;margin:0}
.bround>p{margin:2px 0 8px;font-size:.85rem}
.ctie{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.ctie.tbd{padding:14px;text-align:center}
.ct-team{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 10px;cursor:pointer;color:var(--ink);font:600 .95rem var(--bd);text-align:left}
.ct-team+.ct-team{border-top:1px solid var(--line)}
.ct-team span{flex:1}
.ct-team b{font-family:var(--hd);font-size:1.15rem}
.ct-team.win{font-weight:700}
.ct-team.lose{color:var(--muted)}
.mcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mc-bar{height:5px}
.mc-venue{text-align:center;font-size:.8rem;color:var(--muted);padding:9px 10px 0}
.mc-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 12px 14px}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font:700 1.08rem/1.15 var(--hd);text-align:center;color:var(--ink);padding:4px;border-radius:8px}
.mc-team:hover{background:var(--paper)}
.mc-team.lose{color:var(--muted)}
.mc-score{display:flex;gap:3px;background:#0F1612;border-radius:9px;padding:4px}
.mc-score span{min-width:36px;height:46px;display:grid;place-items:center;font:700 2.05rem/1 var(--hd);color:#fff;background:#1E2D24;border-radius:6px;font-variant-numeric:tabular-nums}
.mc-score.ko span{background:transparent;color:#A9BCB0;font-size:1.25rem;min-width:48px;height:38px}
.mc-ev{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;border-top:1px solid var(--line);padding:10px 14px 12px;font-size:.86rem}
.mc-ev.none{display:block;text-align:center;color:var(--muted)}
.mc-ev ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.mc-ev ul.away{align-items:flex-end;text-align:right}
.mc-ev li{display:flex;gap:6px;align-items:center}
.mc-ev ul.away li{flex-direction:row-reverse}
.gi{color:var(--ink);flex:none}
.ii{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:3px;background:var(--loss);color:#fff;font:700 .78rem/1 var(--bd);flex:none}
.needs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.need{padding:2px 9px;border-radius:999px;font:600 .9rem var(--hd);background:rgba(255,255,255,.14);color:var(--chalk)}
.need.hot{background:var(--loss);color:#fff}
.need.warm{background:var(--flood);color:var(--on-flood,#1B1A10)}
.bbtns{display:flex;flex-direction:column;gap:8px}
.fx.onclock{background:color-mix(in srgb,var(--flood) 22%,transparent);border-radius:6px;padding-left:6px;padding-right:6px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}
.setgrid h3{margin-top:0}
.rng{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.rng>span{display:flex;justify-content:space-between}
.rng input{width:100%;accent-color:var(--turf)}
.wts{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:14px 0}
.wts>span{width:100%}
.wt{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem}
.wt input{width:58px}
.natgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 10px}
.nat{display:flex;gap:6px;align-items:center;font-size:.88rem;cursor:pointer}
.pre{width:46px;height:28px;border-radius:6px;display:block}
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rec{background:var(--paper);border-radius:8px;padding:10px 12px;cursor:pointer;border:1px solid transparent;text-align:left}
.rec:hover{border-color:var(--line)}
.rec .v{font-family:var(--hd);font-size:1.6rem;font-weight:700;line-height:1}
.rec .who{font-weight:600}
.linkbtn{background:none;border:0;padding:0;font-weight:700;font-family:var(--hd);font-size:1.05rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px;display:block;text-align:left}
.editor{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:20px;align-items:start}
.pv{display:grid;place-items:center;min-height:260px;position:sticky;top:20px;gap:10px}
.ctl h4{font-family:var(--hd);font-size:1.1rem;font-weight:600;margin:18px 0 8px}
.ctl h4:first-child{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:.78rem;min-width:66px}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--sel);box-shadow:inset 0 0 0 2px var(--sel)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.hdkit{display:block}
.tabs{margin-bottom:16px}
.pitchwrap{width:100%;max-width:340px}
.pitchwrap>svg{width:100%;height:auto;display:block;border-radius:8px}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
tr.sel td{background:color-mix(in srgb,var(--flood) 20%,transparent)}
.linkbtn.inl{display:inline;font-family:var(--bd);font-size:inherit;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--paper);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.tile b{font-size:1.5rem;line-height:1.1}
.phero{display:flex;gap:18px;align-items:center;margin:14px 0 18px;flex-wrap:wrap}
.pinfo{flex:1;min-width:240px}
.hoftag{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;background:var(--gold);color:#1B1A10;font:600 .85rem var(--hd)}
.plaques{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.plaque{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:10px;cursor:pointer;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 18%,var(--surface)),var(--surface));border:2px solid color-mix(in srgb,var(--gold) 55%,var(--line));color:var(--ink)}
.chart{display:block;width:100%;height:auto;border-radius:6px}
.ringprev{display:flex;gap:16px;align-items:end;margin-bottom:8px}
.mc-motm{border-top:1px solid var(--line);padding:7px 14px;font-size:.84rem;text-align:center}
.ttl{white-space:nowrap;width:1%}
.h2hhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.h2hnums{display:flex;gap:18px;text-align:center}
.h2hnums div{display:flex;flex-direction:column}
.h2hnums b{font-size:2.2rem;line-height:1}
 .h2hfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.h2hfacts>div{background:var(--paper);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.h2hfacts b{font-family:var(--hd);font-size:1.15rem}
.h2hbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;background:var(--line)}
.empty{color:var(--muted);padding:30px;text-align:center;border:2px dashed var(--line);border-radius:10px}
.hist{margin-bottom:16px}
.cabinet{background:linear-gradient(180deg,#7a4b2a,#5a3519);border:2px solid #3a2110;border-radius:12px;padding:0 14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.15)}
.cabcrown{display:flex;justify-content:center;padding:10px 0}
.cabplate{background:linear-gradient(180deg,#f3d27a,#c99a2e);color:#3a2a08;font:700 .95rem var(--hd);letter-spacing:.08em;text-transform:uppercase;padding:4px 18px;border-radius:4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.3)}
.cabin{position:relative;background:linear-gradient(180deg,#2b1a10,#1d120b);border:6px solid #4a2b16;border-radius:4px;padding:14px 14px 0;box-shadow:inset 0 0 30px rgba(0,0,0,.6);overflow:hidden}
.cabin::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 38%,transparent 46%,transparent 60%,rgba(255,255,255,.05) 64%,transparent 70%)}
.cablbl{display:block;color:#e9cf8a;font:700 .8rem var(--hd);letter-spacing:.1em;text-transform:uppercase}
.shelves{display:flex;flex-wrap:wrap;align-content:flex-start;margin:0 -14px 16px;padding:0 14px;background:repeating-linear-gradient(180deg,transparent 0 108px,#9a6a40 108px 110px,#6b4226 110px 118px,#2a170b 118px 120px)}
.cabitem{height:120px;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14px}
.cabitem img{filter:drop-shadow(0 3px 2px rgba(0,0,0,.55))}
.plq{margin-top:4px;background:linear-gradient(180deg,#e9c76a,#b08227);color:#2e2006;font:700 .64rem var(--bd);padding:1px 6px;border-radius:2px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.cabempty{color:#e9cf8a;opacity:.8;text-align:center;padding:30px 0 40px;margin:0}
.caedit{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.caedit.off{opacity:.55}
.caedit>img{flex:none;width:46px}
.caedit .fields{align-items:flex-end}
#an{position:fixed;inset:0;z-index:60;background:repeating-linear-gradient(180deg,var(--turf) 0 80px,var(--turf2) 80px 160px);color:var(--chalk);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#an[hidden]{display:none}
.anbox{width:min(760px,100%);text-align:center;border:2px solid color-mix(in srgb,var(--chalk) 35%,transparent);border-radius:14px;padding:22px 22px 26px;background:rgba(0,0,0,.18)}
.antop{display:flex;justify-content:space-between;gap:10px;color:var(--chalk-dim);font-size:.85rem}
#an h2{font-size:clamp(2rem,6vw,3.2rem);margin:.3em 0 .2em;color:var(--flood)}
.anbody{min-height:260px;display:flex;flex-direction:column;align-items:center;gap:10px}
.antro{margin:4px 0}
.anlbl{margin:6px 0 0;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.08em;font:700 .85rem var(--hd)}
.annoms{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.annoms li{border:1px solid color-mix(in srgb,var(--chalk) 30%,transparent);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;min-width:150px;transition:all .3s}
.annoms li b{font-family:var(--hd);font-size:1.15rem}
.annoms li span{color:var(--chalk-dim);font-size:.82rem}
.annoms li.on{border-color:var(--flood);background:color-mix(in srgb,var(--flood) 22%,transparent)}
.anwin{display:flex;align-items:center;gap:14px;text-align:left;animation:anin .5s ease both}
.anwin b{display:block;font-family:var(--hd);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1}
.anwin span{color:var(--chalk-dim)}
.anscore{font:700 3rem var(--hd);margin:0;animation:anin .5s ease both}
.anscore small{display:block;font-size:1rem;color:var(--chalk-dim)}
.anbtns{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.anbtns .btn{flex:none;width:auto}
#an .tots{width:100%;animation:anin .5s ease both}
@keyframes anin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anwin,.anscore,#an .tots{animation:none}.annoms li{transition:none}}
.mschips{display:flex;flex-wrap:wrap;gap:6px}
.mschip{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:999px;padding:3px 10px;font:600 .85rem var(--bd)}
.mschip small{color:var(--muted);font-weight:500}
.sk{color:var(--star);letter-spacing:-1px;white-space:nowrap}
.sk .off{color:var(--line)}
td.up{color:var(--win)}
td.down{color:var(--loss)}
.trt{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--turf) 12%,var(--surface));border:1px solid var(--line);font:600 .7rem/1.4 var(--bd);color:var(--ink);vertical-align:middle;white-space:nowrap}
.trts{display:flex;gap:4px;margin-top:3px}
.trts .trt{margin-left:0}
.trt.big{font-size:.85rem;padding:3px 9px;margin:0 6px 0 0}
.trt button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:0 0 0 2px}
.ptraits{margin:.2em 0 .4em;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.ptraits select{font-size:.85rem}
.derby{display:inline-block;background:var(--loss);color:#fff;font:700 .72rem/1 var(--hd);text-transform:uppercase;letter-spacing:.04em;padding:3px 6px;border-radius:4px;vertical-align:middle}
.rivrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rivrow input{max-width:200px;font-family:var(--hd);font-weight:700}
.rivclubs{display:flex;gap:8px;align-items:center}
.tots{background:repeating-linear-gradient(180deg,var(--turf) 0 48px,var(--turf2) 48px 96px);border-radius:12px;padding:18px 10px;display:flex;flex-direction:column;gap:14px}
.totsrow{display:flex;justify-content:space-around;gap:8px}
.totsp{background:none;border:0;cursor:pointer;color:var(--chalk);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1;max-width:200px}
.totsp b{font-family:var(--hd);font-size:1.1rem;text-align:center}
.totsp span{color:var(--chalk-dim);font-size:.8rem;text-align:center}
.rvawards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rvaward{display:flex;gap:18px;align-items:center}
.rvaward>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rvaward .linkbtn,.rvaward b{font-family:var(--hd);font-size:1.4rem;font-weight:700}
.rvfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.rvstat{display:flex;flex-direction:column;gap:2px}
.rvstat b{font-family:var(--hd);font-size:1.15rem}
.rvimg{width:100%;max-width:540px;display:block;border-radius:8px;margin:8px auto}
.rvcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.rvcards figure{margin:0}
.hist .top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hist .top .grow{flex:1;min-width:200px}
.hist .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px;font-size:.92rem}
.hist .facts b{display:block;font-family:var(--hd);font-size:1.05rem}
.muted{color:var(--muted)}

dialog{border:0;border-radius:12px;padding:0;max-width:min(720px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,14,.55)}
.dlg{padding:22px}
.dlg .x{float:right}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
#toast.show{opacity:1}

@media (max-width:1480px){.grid2:not(.even){grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}

  .nav{flex-direction:row;overflow-x:auto}
  .nav button{padding:11px 18px;white-space:nowrap}
  .nav button.on{box-shadow:inset 0 -4px 0 var(--flood),inset 0 0 0 999px rgba(255,255,255,.13)}
  .filebox{margin-top:8px}
  .grid2,.grid2.even{grid-template-columns:1fr}
  .srow{grid-template-columns:auto 1fr auto auto;}
  .srow .shortin{display:none}
  .editor{grid-template-columns:1fr}
  .pv{position:static}

  const ev=f.ev.filter(e=>!e.inj).map(e=>{const txt=`${e.m}' ${esc(pname(e.s))}${e.a?` <span class="muted">(${esc(pname(e.a))})</span>`:""}`;return e.t===f.h?`<span>${txt}</span><span></span>`:`<span></span><span class="away">${txt}</span>`}).join("");
  return `<details class="res"><summary class="fx"><span class="h">${clubLabel(team(f.h))}</span><span class="score">${f.hg} – ${f.ag}</span><span>${clubLabel(team(f.a))}</span></summary>${ev?`<div class="ev">${ev}</div>`:`<div class="ev"><span>No goals</span></div>`}</details>`;
}
function leagueTable(rows,form=true){
  return `<div class="scroll"><table><thead><tr><th>#</th><th>Club</th>${form?'<th class="ttl">Titles</th>':""}<th class="r">P</th><th class="r">W</th><th class="r">D</th><th class="r">L</th><th class="r">GF</th><th class="r">GA</th><th class="r">GD</th><th class="r">Pts</th>${form?"<th>Form</th>":""}</tr></thead><tbody>${
    rows.map((r,i)=>{const t=r.name?r:team(r.id);return `<tr class="${i===0?"pos1":""} ${form?"click":""}" ${form?`data-act="club" data-id="${r.id}"`:""}><td class="num">${i+1}</td><td>${clubLabel(t)}</td>${form?`<td class="ttl">${trophies(r.id,20)}</td>`:""}<td class="r num">${r.p}</td><td class="r num">${r.w}</td><td class="r num">${r.d}</td><td class="r num">${r.l}</td><td class="r num">${r.gf}</td><td class="r num">${r.ga}</td><td class="r num">${r.gf-r.ga>0?"+":""}${r.gf-r.ga}</td><td class="r num pts">${r.pts}</td>${form?`<td><span class="form">${r.form.slice(-5).map(x=>`<span class="${x}">${x}</span>`).join("")}</span></td>`:""}</tr>`}).join("")
  }</tbody></table></div>`;
}

/* ---------- views ---------- */
function viewTable(){
  const tbl=computeTable(),done=seasonDone();
  const next=!done?state.fixtures[state.round]:null,last=state.round>0?state.fixtures[state.round-1]:null;
  const leaders=Object.values(state.players).filter(p=>p.s.goals>0).sort((a,b)=>b.s.goals-a.s.goals||b.s.assists-a.s.assists).slice(0,5);
  let banner="";
  if(state.draft){const t=team(state.draft.order[state.draft.pick]);banner=`<div class="banner">${badge(t,56)}<div class="grow"><h2>${state.draft.stage==="setup"?"Set up the opening draft":state.draft.type==="opening"?"The opening draft is underway":`The season ${state.season} draft is open`}</h2><p>${state.draft.stage==="setup"?"Edit the player pool, then start the draft.":`${esc(t.name)} are on the clock with pick ${state.draft.pick+1} of ${state.draft.order.length}.`}</p></div><button class="btn go" data-act="nav" data-v="draft">Go to the draft</button></div>`}
  if(done){const c=team(tbl[0].id);banner=`<div class="banner">${badge(c,64)}<div class="grow"><h2>${esc(c.name)} are champions</h2><p>Season ${state.season} is complete with ${tbl[0].pts} points.</p></div><button class="btn go" data-act="end-season">Start season ${state.season+1}</button></div>`}
  return `${banner}<div class="grid2"><section class="card"><h2>Season ${state.season}</h2>${leagueTable(tbl)}</section><aside class="card">
    ${next?`<h3 style="margin-top:0">Matchday ${state.round+1} of ${state.fixtures.length}</h3>${next.map(fixtureRow).join("")}`:""}
    ${last?`<h3 ${next?"":`style="margin-top:0"`}>Latest results</h3>${last.map(resultRow).join("")}`:""}
    <h3>Top scorers</h3>${leaders.length?`<table><tbody>${leaders.map(p=>`<tr class="click" data-act="player" data-id="${p.id}"><td><span class="namecell">${flag(p.nat)}${esc(p.name)}</span></td><td>${badge(team(p.teamId),18)}</td><td class="r num pts">${p.s.goals}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">Goals will show here once the first matchday is played.</p>`}
  </aside></div>`;
}
let fxRound=null;
const goalIcon=`<svg class="gi" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff" stroke="currentColor" stroke-width="1.6"/><polygon points="12,7.5 16.3,10.6 14.7,15.6 9.3,15.6 7.7,10.6" fill="currentColor"/></svg>`;
function matchCard(f){

  const evs=tid=>f.ev.filter(e=>e.t===tid).map(e=>e.inj?`<li><span class="ii" aria-hidden="true">+</span><span>${esc(pname(e.inj))} <span class="muted">${e.m}', out ${e.n}</span></span></li>`:`<li>${goalIcon}<span>${esc(pname(e.s))} <span class="muted">${e.m}'${e.a?`, ${esc(pname(e.a))}`:""}</span></span></li>`).join("");
  return `<article class="mc"><div class="mc-bar" style="background:linear-gradient(90deg,${esc(H.c1)} 0 50%,${esc(A.c1)} 50% 100%)"></div><div class="mc-venue">${esc(H.ground?H.ground.name:"")}${derbyOf(f.h,f.a)?` <b class="derby">${esc(derbyOf(f.h,f.a).name)}</b>`:""}</div>

  ${f.pen?`<div class="mc-ev none">${esc(team(f.w).name)} win ${Math.max(...f.pen)}–${Math.min(...f.pen)} on penalties</div>`:""}${f.played&&f.ev.length?`<div class="mc-ev"><ul>${evs(f.h)}</ul><ul class="away">${evs(f.a)}</ul></div>`:f.played?`<div class="mc-ev none">No goals</div>`:""}${(()=>{const c={};f.ev.forEach(e=>{if(e.s)c[e.s]=(c[e.s]||0)+1});const ht=Object.keys(c).filter(k=>c[k]>=3);return ht.length?`<div class="mc-motm"><span class="muted">Hat-trick</span> ${ht.map(k=>`<button class="linkbtn inl" data-act="player" data-id="${k}">${esc(pname(k))}</button> <b class="num">${c[k]}</b>`).join(", ")}</div>`:""})()}${f.motm&&pl(f.motm.id)?`<div class="mc-motm"><span class="muted">Player of the match</span> <button class="linkbtn inl" data-act="player" data-id="${f.motm.id}">${esc(pname(f.motm.id))}</button> <b class="num">${f.motm.r.toFixed(1)}</b></div>`:""}</article>`;

function viewFixtures(){
  const N=state.fixtures.length;if(fxRound===null||fxRound>=N||fxRound<0)fxRound=state.round>0?Math.min(state.round-1,N-1):0;
  const i=fxRound,r=state.fixtures[i],played=r.every(f=>f.played);

function cupFixtures(i){
  const C=state.cup;if(!C||C.season!==state.season||!cupOn())return "";const k=C.sched.indexOf(i);if(k<0)return "";const r=C.rounds[k],R=C.sched.length;
  return `<h3>${esc(cupName())}: ${cupRoundName(k,R)}${k===R-1?` <span class="muted" style="font-size:1rem;font-weight:500">Neutral ground</span>`:""}</h3>${r?`<div class="mcgrid">${r.ties.map(matchCard).join("")}</div>${r.byes.length?`<p class="muted">Byes: ${r.byes.map(id=>esc(team(id).name)).join(", ")}</p>`:""}`:`<p class="muted">Drawn after the ${cupRoundName(k-1,R).toLowerCase()}.</p>`}`;

  const key=ps.sort;
  list.sort((a,b)=>{let va,vb;if(key==="rating"){va=a.p.rating;vb=b.p.rating}else if(key==="pot"){va=a.p.retired?0:potSort(a.p);vb=b.p.retired?0:potSort(b.p)}else if(key==="age"){va=a.p.age;vb=b.p.age}else if(key==="titles"){va=a.rg.length;vb=b.rg.length}else if(key==="avg"){va=avgOf(a.st)??0;vb=avgOf(b.st)??0}else if(key==="awards"){va=(a.p.awards||[]).length;vb=(b.p.awards||[]).length}else if(key==="name"){return ps.dir*a.p.name.localeCompare(b.p.name)}else{va=a.st[key];vb=b.st[key]}return ps.dir*(va-vb)||b.p.rating-a.p.rating});

  const row=ps.edit?({p})=>`<tr><td><span class="namecell">${flag(p.nat)}<input type="text" data-pf="name" data-id="${p.id}" value="${esc(p.name)}" maxlength="40" aria-label="Player name"></span></td><td>${clubCell(p)}</td><td>${posSel(p)}</td><td>${natSel(p)}</td><td class="r"><input type="number" min="15" max="45" data-pf="age" data-id="${p.id}" value="${p.age}" aria-label="Age"></td><td>${stars(p.rating,p.id)}</td><td><input type="number" min="20" max="99" data-pf="rating" data-id="${p.id}" value="${p.rating}" aria-label="Exact ability"></td><td><button class="btn sm" data-act="player" data-id="${p.id}">Career</button></td></tr>`

}
function resizeSetup(n){
  const used=setup.teams.map(t=>t.name);
  while(setup.teams.length<n){const nm=teamNameGen(used);used.push(nm);const c=pick(COLOURS);setup.teams.push({name:nm,c1:c[0],c2:c[1],crest:randomCrest(c[1])})}
  setup.teams.length=n;
}

  ${setup.teams.map((t,i)=>`<div class="srow">${badge({...t,short:shortOf(t.name)},30)}<input type="text" data-sf="name" data-i="${i}" value="${esc(t.name)}" maxlength="40" aria-label="Club ${i+1} name"><span class="shortin muted">${esc(shortOf(t.name))}</span><input type="color" data-sf="c1" data-i="${i}" value="${t.c1}" aria-label="Main colour"><input type="color" data-sf="c2" data-i="${i}" value="${t.c2}" aria-label="Second colour"><span></span></div>`).join("")}

function createLeague(){
  const mode=setup.mode;
  state={app:"leaguesim",version:1,retired:{},name:setup.name.trim()||"My League",format:setup.format,season:1,round:0,teams:[],players:{},fixtures:[],history:[]};
  migrate(state);state.settings.homeNation=setup.home||"";state.settings.homeShare=setup.homeShare||50;
  for(const s of setup.teams){
    const t={id:uid(),name:s.name.trim()||teamNameGen([]),c1:s.c1,c2:s.c2,players:[]};t.short=shortOf(t.name);t.crest=s.crest||randomCrest(s.c2);t.kit=randomKit(s.c1,s.c2);t.ground=randomGround(t.name);
    state.teams.push(t);
    if(mode!=="draft"){const bias=randInt(-6,6);for(const [pos,n] of Object.entries(FORMATS[state.format].squad))for(let i=0;i<n;i++){const p=newPlayer(pos,t.id);p.rating=clamp(p.rating+bias,35,92);state.players[p.id]=p;t.players.push(p.id)}}
  }
  state.fixtures=makeFixtures();
  if(mode==="draft")startOpeningDraft();

}

/* ---------- files ---------- */
const slug=()=>(state.name||"league").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"league";
async function saveFile(asNew){
  const data=saveText();
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle||asNew)fileHandle=await window.showSaveFilePicker({suggestedName:`${slug()}.json`,types:[{description:"League save",accept:{"application/json":[".json"]}}]});
      const w=await fileHandle.createWritable();await w.write(data);await w.close();
      dirty=false;toast(`Saved to ${fileHandle.name}`);render();return;
    }catch(e){if(e.name==="AbortError")return;console.warn(e)}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=`${slug()}-s${state.season}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);dirty=false;toast("Save file downloaded");render();
}
async function loadFile(){
  if(dirty&&state&&!confirm("You have unsaved changes. Open another file anyway?"))return;
  if(window.showOpenFilePicker){
    try{const [h]=await window.showOpenFilePicker({types:[{description:"League save",accept:{"application/json":[".json"]}}]});const txt=await (await h.getFile()).text();if(applyLoad(txt))fileHandle=h,render();return}
    catch(e){if(e.name==="AbortError")return;console.warn(e)}
  }
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=async()=>{const f=inp.files[0];if(f&&applyLoad(await f.text())){fileHandle=null;render()}};inp.click();
}
function applyLoad(txt){
  try{const d=JSON.parse(txt);if(d.app!=="leaguesim"||!Array.isArray(d.teams))throw 0;state=migrate(d);dirty=false;view="table";setup=null;try{localStorage.setItem("leaguesim-backup",txt)}catch(e){}if(state.__traitsAdded){delete state.__traitsAdded;persist();toast(`Opened ${d.name}. Your players now have traits. Save to keep them.`)}else toast(`Opened ${d.name}`);return true}
  catch(e){toast("That file is not a League Sim save. Pick a .json file saved from this app.");return false}
}

    case "pmore":ps.lim+=50;break;
    case "star":{const p=pl(id);p.rating=tierRating(+v);persist();break}
    case "add-player":{const t=team(id);const counts=POS.map(x=>t.players.filter(pid=>pl(pid)&&pl(pid).pos===x).length);const need=POS.reduce((best,x,i)=>{const want=FORMATS[state.format].squad[x];return counts[i]-want<best.d?{x,d:counts[i]-want}:best},{x:"MF",d:Infinity}).x;const p=newPlayer(need,id);state.players[p.id]=p;t.players.push(p.id);persist();toast(`${p.name} joined as ${need}`);break}
    case "remove-player":{const p=pl(id),t=team(p.teamId);const min=Object.values(FORMATS[state.format].lineup).reduce((a,b)=>a+b,0);if(t.players.length<=min){toast(`A squad needs at least ${min} players`);return}if(!confirm(`Remove ${p.name} from ${t.name}?`))return;t.players=t.players.filter(x=>x!==id);delete state.players[id];persist();break}
    case "rename-squad":{const t=team(id);if(!confirm(`Give every ${t.name} player a new generated name?`))return;t.players.forEach(pid=>{pl(pid).name=genName(pl(pid).nat)});persist();break}
    case "paste-open":return pasteModal(id);
    case "paste-apply":{const t=team(id);const names=$("#pasteBox").value.split("\n").map(s=>s.trim()).filter(Boolean);const sq=t.players.map(pl).sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)||b.rating-a.rating);names.forEach((n,i)=>{if(sq[i])sq[i].name=n.slice(0,40);else{const p=newPlayer("MF",id,{name:n.slice(0,40)});state.players[p.id]=p;t.players.push(p.id)}});persist();closeModal();toast(`${names.length} names applied`);break}
  }
  render();
});
function applyField(t,el){const v=el.value;if(el.dataset.tf)t[el.dataset.tf]=v;else if(el.dataset.cf)t.crest[el.dataset.cf]=v;else if(el.dataset.kf)t.kit[kitSide][el.dataset.kf]=v;else if(el.dataset.gf)t.ground[el.dataset.gf]=v}
document.addEventListener("input",e=>{
  const el=e.target;
  if(state&&el.hasAttribute("data-dq")){ps.dq=el.value;render();const s3=$("[data-dq]");if(s3){s3.focus();const L=s3.value.length;try{s3.setSelectionRange(L,L)}catch(x){}}return}
  if(state&&el.hasAttribute("data-pq")){ps.q=el.value;ps.lim=50;render();const s2=$("[data-pq]");if(s2){s2.focus();const L=s2.value.length;try{s2.setSelectionRange(L,L)}catch(x){}}return}
  if(state&&el.dataset.set&&el.type==="range"){const o=$(`[data-out="${el.dataset.set}"]`);if(o)o.textContent=el.value+(el.dataset.unit||"");return}
  if(state&&el.dataset.ring==="size"){const o=$(`[data-out="ringsize"]`);if(o)o.textContent=el.value+"px";return}
  if(state&&el.dataset.themeK){state.settings.theme[el.dataset.themeK]=el.value;applyTheme();return}
  if(state&&el.type==="color"&&el.dataset.id&&(el.dataset.tf||el.dataset.cf||el.dataset.kf||el.dataset.gf)){const t=team(el.dataset.id);if(t){applyField(t,el);const pv=$("#pv");if(pv)pv.innerHTML=previewHTML(t)}return}
  if(el.dataset.sf&&setup){if(el.dataset.sf==="league")setup.name=el.value;else if(el.dataset.sf==="name")setup.teams[+el.dataset.i].name=el.value}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.sf==="home"&&setup){setup.home=el.value;renderSetup();return}
  if(el.dataset.sf==="share"&&setup){setup.homeShare=+el.value;renderSetup();return}
  if(el.dataset.sf&&setup){const i=+el.dataset.i;if(el.dataset.sf==="c1"||el.dataset.sf==="c2"){setup.teams[i][el.dataset.sf]=el.value}renderSetup();return}
  if(!state)return;
  if(el.dataset.upload){const f=el.files&&el.files[0],t=team(el.dataset.upload);if(!f||!t)return;readImg(f).then(u=>{t.crest.img=u;persist();render();toast("Badge image added")}).catch(()=>toast("That image could not be read. Try a PNG or JPG file."));return}
  if(el.dataset.set){const S=state.settings,k=el.dataset.set;if(k==="homeNation")S[k]=el.value;else S[k]=+el.value;if(k==="draftAgeMin"&&S.draftAgeMin>S.draftAgeMax)S.draftAgeMax=S.draftAgeMin;if(k==="draftAgeMax"&&S.draftAgeMax<S.draftAgeMin)S.draftAgeMin=S.draftAgeMax;persist();render();return}
  if(el.dataset.setw){const S=state.settings;S[el.dataset.setw][+el.dataset.i]=clamp(parseInt(el.value)||0,0,100);persist();render();return}
  if(el.dataset.nat){const S=state.settings,c=el.dataset.nat;S.nations=el.checked?[...new Set([...S.nations,c])]:S.nations.filter(x=>x!==c);persist();render();return}
  if(el.dataset.themeK){persist();render();return}
  if(el.dataset.mf){const m=state.managers[el.dataset.id],k=el.dataset.mf;if(m){if(k==="name")m.name=el.value.trim()||m.name;else if(k==="style")m.style=el.value;else m[k]=clamp(+el.value,1,5)}persist();render();return}
  if(el.dataset.ca){const c=(state.settings.customAwards||[]).find(x=>x.id===el.dataset.id);if(c){const k=el.dataset.ca;c[k]=el.value.trim()||(k==="name"?c.name:"");if(k==="name"&&!c.short)c.short=c.name.slice(0,8)}persist();render();return}
  if(el.dataset.anight!==undefined){state.settings.awardsNight=el.checked;persist();render();return}
  if(el.dataset.reveal!==undefined){state.settings.revealPot=el.checked;persist();render();return}
  if(el.dataset.sack!==undefined){state.settings.sackings=el.checked;persist();render();return}
  if(el.dataset.traitAdd){const p=pl(el.dataset.traitAdd);if(p&&el.value&&traitOk(p,el.value,p.tr||[])&&(p.tr||[]).length<2)p.tr=[...(p.tr||[]),el.value];persist();render();return}
  if(el.dataset.rvname){const r=(state.rivals||[]).find(x=>x.k===el.dataset.rvname);if(r&&el.value.trim())r.name=el.value.trim().slice(0,30);persist();render();return}
  if(el.dataset.cupset){const c=state.settings.cup;if(el.dataset.cupset==="on")c.on=el.checked;else c.name=el.value.trim();persist();render();return}
  if(el.dataset.tro){const TS=state.settings.trophies=state.settings.trophies||{};TS[trophyTab]={...trophySpec(trophyTab),accent:el.value};persist();render();return}
  if(el.dataset.ring){const R2=state.settings.ring;if(el.dataset.ring==="size")R2.size=clamp(+el.value,18,60);else R2.text=el.value.toUpperCase().replace(/[^A-Z0-9 ]/g,"").slice(0,10);persist();render();return}
  if(el.dataset.h2h){h2h[el.dataset.h2h]=el.value;render();return}
  if(el.dataset.tb){tb[el.dataset.tb]=el.value;tb["g"+el.dataset.tb]=[];render();return}
  if(el.dataset.lf){state.name=el.value.trim()||state.name;persist();render();return}
  if(el.dataset.tf){const t=team(el.dataset.id),k=el.dataset.tf;let v=el.value;if(k==="name"){v=v.trim()||t.name;if(t.short===shortOf(t.name))t.short=shortOf(v)}if(k==="short")v=v.trim().toUpperCase().slice(0,3)||t.short;t[k]=v;persist();render();return}
  if(el.dataset.cf||el.dataset.kf||el.dataset.gf){const t=team(el.dataset.id);if(el.dataset.gf==="name"){t.ground.name=el.value.trim()||t.ground.name}else applyField(t,el);persist();render();return}
  if(el.dataset.pf){const p=pl(el.dataset.id),k=el.dataset.pf;if(k==="name")p.name=el.value.trim()||p.name;else if(k==="pos")p.pos=el.value;else if(k==="age")p.age=clamp(parseInt(el.value)||p.age,15,45);else if(k==="nat")p.nat=el.value;else if(k==="rating"){p.rating=clamp(parseInt(el.value)||p.rating,20,99);if(p.pot!==undefined)p.pot=Math.max(p.pot,p.rating)}persist();render()}
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
window.addEventListener("beforeunload",e=>{if(dirty&&state){e.preventDefault();e.returnValue=""}});

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3200)}

/* ---------- start ---------- */
try{const b=localStorage.getItem("leaguesim-backup");if(b){const d=JSON.parse(b);if(d&&d.app==="leaguesim"){state=migrate(d);if(state.__traitsAdded){delete state.__traitsAdded;persist()}dirty=true;setTimeout(()=>toast("Restored your last session. Save to a file to keep it."),300)}}}catch(e){}
render();

/* ---------- installable app ---------- */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
  // When a newer version of the app takes over, reload once so it shows straight away
  let _swHad=!!navigator.serviceWorker.controller,_swRe=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(_swHad&&!_swRe&&!dirty){_swRe=true;location.reload()}_swHad=true})}
</script>
